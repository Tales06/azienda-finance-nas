services:
  db:
    image: postgres:16
    container_name: azienda-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Imposta POSTGRES_DB nel file .env}
      POSTGRES_USER: ${POSTGRES_USER:?Imposta POSTGRES_USER nel file .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - "${DB_DATA_PATH:-finance-db-data}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  init:
    build:
      context: .
      target: migrator
    container_name: azienda-finance-init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Imposta DATABASE_URL nel file .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Imposta ADMIN_PASSWORD nel file .env}
      TZ: ${TZ:-Europe/Rome}

  app:
    build:
      context: .
      target: runner
    container_name: azienda-finance-app
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Imposta DATABASE_URL nel file .env}
      AUTH_SECRET: ${AUTH_SECRET:?Imposta AUTH_SECRET nel file .env}
      APP_URL: ${APP_URL:?Imposta APP_URL con l'IP o il nome HTTPS del NAS}
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: azienda-finance-ntfy
    profiles: ["notifications"]
    restart: unless-stopped
    init: true
    command: ["serve"]
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_BASE_URL:-http://localhost:2586}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - "${NTFY_DATA_PATH:-./ntfy}:/var/lib/ntfy"
    ports:
      - "${NTFY_BIND_ADDRESS:-0.0.0.0}:${NTFY_PORT:-2586}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  # The existing Tailscale container on the NAS uses its own Docker network.
  # This relay shares that container's network namespace and forwards only
  # localhost:8080 to ntfy on the NAS. Tailscale Serve targets this port.
  ntfy-relay:
    build:
      context: .
      target: notifier
    container_name: azienda-finance-ntfy-relay
    profiles: ["notifications"]
    restart: unless-stopped
    network_mode: "container:${TAILSCALE_CONTAINER_NAME:-tailscale}"
    environment:
      NTFY_RELAY_HOST: ${NTFY_RELAY_HOST:-192.168.1.23}
      NTFY_RELAY_PORT: ${NTFY_PORT:-2586}
      NTFY_RELAY_LISTEN_PORT: "8080"
    command: ["node", "scripts/ntfy-relay.mjs"]

  backup:
    image: postgres:16
    profiles: ["maintenance"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Imposta POSTGRES_DB nel file .env}
      PGUSER: ${POSTGRES_USER:?Imposta POSTGRES_USER nel file .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - "${BACKUP_PATH:-./backups}:/backups"
    command: ["sh", "-c", "pg_dump --format=custom --file=/backups/finance_$$(date +%Y%m%d_%H%M%S).dump"]

  reminders:
    build:
      context: .
      target: notifier
    profiles: ["notifications"]
    depends_on:
      db:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Imposta DATABASE_URL nel file .env}
      NTFY_PUBLISH_URL: ${NTFY_PUBLISH_URL:-http://ntfy}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_ACCESS_TOKEN: ${NTFY_ACCESS_TOKEN:-}
      TZ: ${TZ:-Europe/Rome}

volumes:
  finance-db-data:
