services:
  db:
    image: postgres:16
    container_name: azienda-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Imposta POSTGRES_DB nel file .env}
      POSTGRES_USER: ${POSTGRES_USER:?Imposta POSTGRES_USER nel file .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - "${DB_DATA_PATH:-finance-db-data}:/var/lib/postgresql/data"
    # Accessibile solo dal computer che esegue Docker: serve a `npm run dev`.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  init:
    build:
      context: .
      target: migrator
    container_name: azienda-finance-init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Imposta DATABASE_URL nel file .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Imposta ADMIN_PASSWORD nel file .env}
      TZ: ${TZ:-Europe/Rome}

  app:
    build:
      context: .
      target: runner
    container_name: azienda-finance-app
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Imposta DATABASE_URL nel file .env}
      AUTH_SECRET: ${AUTH_SECRET:?Imposta AUTH_SECRET nel file .env}
      APP_URL: ${APP_URL:?Imposta APP_URL con l'IP o il nome HTTPS del NAS}
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    image: postgres:16
    profiles: ["maintenance"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Imposta POSTGRES_DB nel file .env}
      PGUSER: ${POSTGRES_USER:?Imposta POSTGRES_USER nel file .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - "${BACKUP_PATH:-./backups}:/backups"
    command: ["sh", "-c", "pg_dump --format=custom --file=/backups/finance_$$(date +%Y%m%d_%H%M%S).dump"]

volumes:
  finance-db-data:
